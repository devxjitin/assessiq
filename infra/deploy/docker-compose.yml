# Runs on the EC2 host in /opt/assessiq (started by deploy.sh).
# Variables come from /opt/assessiq/.deploy.env, written by deploy.sh.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  api:
    image: ${ECR_REGISTRY}/assessiq-${ENVIRONMENT}-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      - redis

  worker:
    image: ${ECR_REGISTRY}/assessiq-${ENVIRONMENT}-worker:${IMAGE_TAG}
    restart: unless-stopped
    command: ['node', 'dist/index.js']
    env_file: .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  redis_data:
