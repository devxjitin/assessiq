name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assessiq
          POSTGRES_PASSWORD: assessiq
          POSTGRES_DB: assessiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assessiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://assessiq:assessiq@localhost:5432/assessiq_test
      DATABASE_URL: postgresql://assessiq:assessiq@localhost:5432/assessiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  images:
    # Proves the Docker images still build (no push).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --build-arg APP=${{ matrix.app }} -t assessiq-${{ matrix.app }}:ci .
