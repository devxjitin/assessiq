name: Deploy staging

# Runs after CI passes on main, or manually from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC to AWS
  contents: read

env:
  ENVIRONMENT: staging
  AWS_REGION: ap-south-1

jobs:
  guard:
    # Only deploy when CI succeeded (or when started manually).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI passed, deploying ${{ github.sha }}"

  web:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @assessiq/shared
        # NEXT_PUBLIC_* values are baked in at build time.
      - run: npm run build -w @assessiq/web
        env:
          NEXT_PUBLIC_API_URL: https://${{ vars.API_HOSTNAME }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload site to S3
        run: |
          # Hashed assets are immutable; HTML must always be revalidated.
          aws s3 sync apps/web/out "s3://${{ vars.WEB_BUCKET }}" --delete \
            --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/web/out "s3://${{ vars.WEB_BUCKET }}" --delete \
            --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

  backend:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      # The server is ARM (Graviton), so build linux/arm64 images.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and push API and worker images
        run: |
          for app in api worker; do
            docker buildx build --platform linux/arm64 --build-arg APP=$app \
              -t "${{ steps.ecr.outputs.registry }}/assessiq-$ENVIRONMENT-$app:$IMAGE_TAG" \
              -t "${{ steps.ecr.outputs.registry }}/assessiq-$ENVIRONMENT-$app:latest" \
              --push .
          done
      - name: Upload deploy files
        run: aws s3 cp infra/deploy "s3://${{ vars.FILES_BUCKET }}/deploy/" --recursive
      - name: Deploy on the server (SSM)
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy $IMAGE_TAG" \
            --timeout-seconds 600 \
            --parameters commands="[
              \"set -e\",
              \"mkdir -p /opt/assessiq && cd /opt/assessiq\",
              \"aws s3 cp s3://${{ vars.FILES_BUCKET }}/deploy/ . --recursive --region $AWS_REGION\",
              \"chmod +x deploy.sh\",
              \"ENVIRONMENT=$ENVIRONMENT AWS_REGION=$AWS_REGION FILES_BUCKET=${{ vars.FILES_BUCKET }} ECR_REGISTRY=$REGISTRY IMAGE_TAG=$IMAGE_TAG API_HOST=${{ vars.API_HOSTNAME }} WEB_ORIGIN=https://${{ vars.WEB_HOSTNAME }} ./deploy.sh\"
            ]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ] || { echo "Deploy failed: $STATUS"; exit 1; }
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ vars.API_HOSTNAME }}/health"
